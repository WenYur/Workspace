<!-- feat(ui-lib): ui-card template with named ng-content slots -->
<article
  [class]="'rounded-xl overflow-hidden transition-all duration-300 ' + elevationClasses"
  role="article"
>
  <!-- Header: clicable, emite headerClicked al padre -->
  <header
    class="px-6 py-4 cursor-pointer hover:bg-[#00ff41]/5 transition-colors duration-200 border-b border-[#00ff41]/20"
    (click)="headerClicked.emit()"
    role="button"
    tabindex="0"
    (keydown.enter)="headerClicked.emit()"
    (keydown.space)="headerClicked.emit()"
    [attr.aria-label]="'Card: ' + title()"
  >
    <h3 class="text-[#00ff41] font-semibold text-lg leading-tight tracking-wide">
      {{ title() }}
    </h3>
    @if (subtitle()) {
      <p class="text-[#8892b0] text-sm mt-1">{{ subtitle() }}</p>
    }
  </header>

  <!-- Body: contenido arbitrario proyectado por el padre -->
  <div class="px-6 py-4">
    <ng-content />
  </div>

  <!-- Footer: slot nombrado opcional — usar atributo card-footer en el elemento hijo -->
  <footer class="px-6 py-3 border-t border-[#00ff41]/10">
    <ng-content select="[card-footer]" />
  </footer>
</article>
